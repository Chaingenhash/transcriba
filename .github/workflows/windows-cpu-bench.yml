# Times the Windows CPU build against a clang-cl build of the same code.
#
# The question this answers: a Ryzen 7 9700X desktop takes roughly 4 hours per
# hour of audio on the CPU-only Windows build, while a Meteor Lake *laptop*
# managed about 1.4 hours on Linux. The desktop should win by 2-3x, so a ~6-9x
# discrepancy has no hardware explanation. Same model, same AVX2 baseline
# (Meteor Lake has no AVX-512 either), all cores at 100%. The largest remaining
# difference is the compiler: Linux builds ggml with GCC, Windows with MSVC,
# and MSVC is widely reported to generate substantially worse code for ggml's
# quantized kernels.
#
# Unlike the GPU questions, this one is settleable in CI: both builds run on
# one runner, against one audio file, with a fixed thread count. Only the
# compiler differs, so the ratio is the answer — no GPU and no local hardware
# needed.
#
# It stays dispatch-only: it downloads the 574MB production model and runs two
# full transcriptions, which is far too slow for every push.
name: windows-cpu-bench
on: workflow_dispatch

jobs:
  bench:
    runs-on: windows-latest
    env:
      GGML_NATIVE: "OFF"
      # Fixed rather than derived from the runner, so a runner with a different
      # core count does not silently change what is being compared.
      BENCH_THREADS: "4"
      BENCH_SECONDS: "300"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # Both builds use Ninja rather than the Visual Studio generator, which is
      # what makes this a controlled comparison: the generator, the flags and
      # every cmake variable stay fixed, and the C/C++ compiler is the only
      # thing that changes between the two runs.
      #
      # The Visual Studio generator cannot express this cleanly. Setting
      # CMAKE_GENERATOR_TOOLSET as an environment variable is ignored outright
      # ("because CMAKE_GENERATOR is not set"), and forwarding it as a cache
      # define collides with the `-T host=x64` the cmake crate always passes:
      # "generator toolset: host=x64 does not match the toolset used
      # previously: ClangCL" (run 32472538177).
      - uses: seanmiddleditch/gha-setup-ninja@v6
      # Puts cl.exe, clang-cl.exe and the Windows SDK headers on PATH. The VS
      # generator finds those itself; Ninja does not.
      - uses: ilammy/msvc-dev-cmd@v1

      # The real q5_0 production model, not ggml-tiny: the whole hypothesis is
      # about codegen for quantized kernels, and tiny is f16, so it would
      # measure the wrong thing.
      - name: Cache the production model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model/ggml-large-v3-turbo-q5_0.bin
          key: whisper-large-v3-turbo-q5_0

      - name: Fetch the production model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path model | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true" `
            -OutFile model/ggml-large-v3-turbo-q5_0.bin
        shell: pwsh

      # Synthesized speech, via the Windows speech API. ffmpeg is not on this
      # runner image, and noise would have been the wrong input anyway: the
      # pipeline returns NoSpeech when a run produces no cues, so a clip whisper
      # finds nothing in could fail the benchmark instead of timing it. Real
      # speech also exercises the decoder rather than the encoder alone.
      #
      # The paragraph is repeated to reach roughly BENCH_SECONDS; the exact
      # duration is read back from the WAV header afterwards, since synthesis
      # speed is not something to assume.
      - name: Generate the benchmark clip
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $synth.SetOutputToWaveFile("bench.wav")
          $para = "The quarterly review covered three separate topics. " +
                  "First, the migration schedule, which slipped by two weeks " +
                  "after the storage vendor delayed delivery. Second, the " +
                  "hiring plan, still waiting on budget approval from finance. " +
                  "Third, and most urgently, the backup restore test that " +
                  "nobody has run since March."
          # ~40 seconds of speech per repetition at the default rate.
          $reps = [math]::Max(1, [int]([int]$env:BENCH_SECONDS / 40))
          1..$reps | ForEach-Object { $synth.Speak($para) }
          $synth.Dispose()

          # Walk the RIFF chunks rather than reading fixed offsets. The
          # synthesizer emits a `fact` chunk between `fmt ` and `data`, so
          # byte 40 is not the data size — assuming it reported a 5-minute clip
          # as 22 hours.
          $bytes = [System.IO.File]::ReadAllBytes("bench.wav")
          $pos = 12   # past "RIFF" + size + "WAVE"
          $byteRate = 0; $dataBytes = 0
          while ($pos + 8 -le $bytes.Length) {
            $id   = [System.Text.Encoding]::ASCII.GetString($bytes, $pos, 4)
            $size = [System.BitConverter]::ToUInt32($bytes, $pos + 4)
            if ($id -eq "fmt ") { $byteRate  = [System.BitConverter]::ToUInt32($bytes, $pos + 16) }
            if ($id -eq "data") { $dataBytes = $size; break }
            $pos += 8 + $size + ($size % 2)   # chunks are word-aligned
          }
          if ($byteRate -eq 0 -or $dataBytes -eq 0) { throw "could not read fmt/data chunks from bench.wav" }
          $duration = [math]::Round($dataBytes / $byteRate, 1)
          if ($duration -lt 30) { throw "benchmark clip is only $duration s; synthesis produced too little audio" }
          echo "bench.wav: $duration s"
          echo "BENCH_AUDIO_SECONDS=$duration" >> $env:GITHUB_ENV
        shell: pwsh

      # /EHsc on both builds, and it has to be both. The cmake crate replaces
      # CMAKE_CXX_FLAGS wholesale, which drops the /EHsc that CMake's MSVC
      # defaults would otherwise supply. cl.exe merely warns about compiling
      # `try` with exceptions disabled; clang-cl rejects it outright
      # ("cannot use 'try' with exceptions disabled", ggml/src/gguf.cpp).
      # Setting it only on the clang build would fix the error and quietly make
      # the two builds incomparable.
      - name: Build with MSVC
        env:
          CMAKE_GENERATOR: Ninja
          CXXFLAGS: /EHsc
        run: cargo build --release -p transcriba-cli --locked --target-dir target-msvc

      # clang-cl is MSVC-ABI compatible, so the Rust link step is unchanged and
      # ggml still takes its `if (MSVC)` cmake branch — same /arch:AVX2, same
      # defines. whisper-rs-sys forwards any CMAKE_* environment variable to
      # cmake, which is what makes the compiler swap reachable without patching
      # the crate.
      - name: Build with clang-cl
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_C_COMPILER: clang-cl
          CMAKE_CXX_COMPILER: clang-cl
          CXXFLAGS: /EHsc
        run: cargo build --release -p transcriba-cli --locked --target-dir target-clang

      - name: Time both builds
        env:
          TRANSCRIBA_MODEL_PATH: model/ggml-large-v3-turbo-q5_0.bin
        run: |
          $ErrorActionPreference = "Stop"
          function Measure-Build($label, $exe) {
            # One warm-up-free timed run each. The model load is included in
            # both and is identical work, so it cancels out of the ratio.
            #
            # Write-Host, not echo: a PowerShell function returns everything it
            # emits to the output stream, so an `echo` here made the caller
            # receive Object[] of (message, seconds) and the ratio blew up with
            # "[System.Object[]] does not contain a method named op_Division"
            # after both 7-minute transcriptions had already run.
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            & $exe bench.wav --lang en --threads $env:BENCH_THREADS | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$label run failed with exit code $LASTEXITCODE" }
            $sw.Stop()
            $secs = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            Write-Host "$label`: $secs s"
            return $secs
          }
          $msvc  = Measure-Build "MSVC"     "target-msvc\release\transcriba.exe"
          $clang = Measure-Build "clang-cl" "target-clang\release\transcriba.exe"

          $ratio = [math]::Round($msvc / $clang, 2)
          $audio = [double]$env:BENCH_AUDIO_SECONDS
          $summary = @(
            "## Windows CPU codegen benchmark",
            "",
            "$([math]::Round($audio / 60, 1)) minutes of speech, $env:BENCH_THREADS threads, large-v3-turbo-q5_0.",
            "",
            "| build | wall clock | vs realtime |",
            "|---|---|---|",
            "| MSVC (shipped) | $msvc s | $([math]::Round($msvc / $audio, 2))x |",
            "| clang-cl | $clang s | $([math]::Round($clang / $audio, 2))x |",
            "",
            "**clang-cl is ${ratio}x the speed of MSVC.** Above ~1.3x is worth",
            "switching the shipped Windows build to the LLVM toolset."
          ) -join "`n"
          echo $summary
          echo $summary >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh
