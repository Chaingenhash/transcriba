# Builds installers on a v* tag and attaches them to a GitHub release.
#
# Artifacts are UNSIGNED, a deliberate choice: a code-signing certificate costs
# €200-400/year and this is an internal tool for a handful of colleagues.
# Windows users will see "Windows protected your PC" and must click More info ->
# Run anyway. The README documents this; do not remove that note.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libvulkan-dev and glslc are for the `vulkan` feature the Linux
          # build enables below — whisper.cpp's Vulkan backend needs the loader
          # headers and a GLSL shader compiler at build time.
          sudo apt-get install -y cmake libclang-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libvulkan-dev glslc

      - name: Verify Windows build tools
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          if (-not $?) { throw "cmake not found on windows-latest runner" }
          if (-not $env:LIBCLANG_PATH) { echo "LIBCLANG_PATH unset; bindgen may need it" }
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        # NO_STRIP=1 is required here: linuxdeploy's vendored strip predates the
        # SHT_RELR/.relr.dyn compact-relocation format current binutils emits, so
        # it fails on system .so files (webkit2gtk, gtk, glib, ...) with "unknown
        # type [0x13] section '.relr.dyn'" and tauri build reports the unhelpful
        # "failed to run linuxdeploy". This is not machine-specific — see
        # docs/superpowers/plan-2-carry-forward.md and README.md. Do not remove
        # this without first vendoring a linuxdeploy release whose strip
        # understands RELR.
        env:
          NO_STRIP: "1"
        # `--features vulkan` is Linux-only and deliberate. Measured on Intel
        # Meteor Lake (Mesa): 110s vs 431s for a 5-minute clip, a 3.9x speedup,
        # transcripts matching to within one word. The reported backend always
        # reflects what actually ran, so a machine without a usable Vulkan
        # device falls back to CPU and says so in the document header.
        run: npx tauri build --bundles ${{ matrix.bundles }} --features vulkan

      - name: Build the installer (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: app
        # No `--features vulkan` here: whisper.cpp silently fails to register
        # the Vulkan backend on Windows MSVC static builds (a static-init race
        # in ggml_vk_instance_init), so it would ship the build-time cost and
        # the GPU code path while always falling back to CPU. Revisit if that
        # upstream bug is fixed.
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # `app/src-tauri` is a workspace member, so cargo (and tauri, which shells out to
      # it) writes to the *workspace root's* target directory, not `app/src-tauri/target`
      # — that path never exists. Each matrix leg attaches only its own bundle, with an
      # explicit extension (not a bare `bundles/${{ matrix.bundles }}/*`, which would also
      # match the unpacked `Transcriba.AppDir/` directory tauri leaves next to the
      # AppImage), so a future path change fails the upload loudly instead of silently
      # attaching nothing.
      - name: Attach the AppImage to the release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true
          draft: true

      - name: Attach the Windows installer to the release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          draft: true
