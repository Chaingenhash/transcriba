# Builds installers on a v* tag and attaches them to a GitHub release.
#
# Artifacts are UNSIGNED, a deliberate choice: a code-signing certificate costs
# €200-400/year and this is an internal tool for a handful of colleagues.
# Windows users will see "Windows protected your PC" and must click More info ->
# Run anyway. The README documents this; do not remove that note.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    # `v*` also matches `v0.1.1-cuda`, the tag that publishes the NVIDIA-only
    # build through windows-cuda.yml. Without this guard that tag would fire
    # both workflows and race two different installers into two releases. GitHub
    # offers no negative tag filter, so the exclusion lives here — job-level `if`
    # can read `github`, which is all this needs.
    if: ${{ !endsWith(github.ref, '-cuda') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    # Portability, not just CI hygiene: ggml defaults GGML_NATIVE to ON and
    # would bake `-march=native` for the build runner's CPU into the shipped
    # AppImage and installer, so a colleague on an older machine gets a SIGILL
    # instead of a transcript. See ci.yml for the full failure and for what OFF
    # substitutes (an AVX2-era baseline). Keep both workflows in step.
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Bump this prefix whenever the native/instruction-set flags change —
      # nothing else invalidates a cached libwhisper built with the old ones.
      # `shared-key` replaces the per-job cache key, so bundle-dryrun.yml — which
      # runs these same build steps on demand — shares this cache instead of
      # warming a second copy. A green dry run therefore leaves a tag build with
      # nothing to rebuild but the crates that changed.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ggml-portable
          shared-key: release-bundle
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libvulkan-dev and glslc are for the `vulkan` feature the Linux
          # build enables below — whisper.cpp's Vulkan backend needs the loader
          # headers and a GLSL shader compiler at build time.
          sudo apt-get install -y cmake libclang-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libvulkan-dev glslc

      - name: Verify Windows build tools
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          if (-not $?) { throw "cmake not found on windows-latest runner" }
          if (-not $env:LIBCLANG_PATH) { echo "LIBCLANG_PATH unset; bindgen may need it" }
        shell: pwsh

      # Windows needs the same loader/headers and glslc that apt provides on
      # Linux. The runner has neither.
      - name: Install the Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        # NO_STRIP=1 is required here: linuxdeploy's vendored strip predates the
        # SHT_RELR/.relr.dyn compact-relocation format current binutils emits, so
        # it fails on system .so files (webkit2gtk, gtk, glib, ...) with "unknown
        # type [0x13] section '.relr.dyn'" and tauri build reports the unhelpful
        # "failed to run linuxdeploy". This is not machine-specific — see
        # docs/superpowers/plan-2-carry-forward.md and README.md. Do not remove
        # this without first vendoring a linuxdeploy release whose strip
        # understands RELR.
        env:
          NO_STRIP: "1"
        # `--features vulkan` is Linux-only and deliberate. Measured on Intel
        # Meteor Lake (Mesa): 110s vs 431s for a 5-minute clip, a 3.9x speedup,
        # transcripts matching to within one word. The reported backend always
        # reflects what actually ran, so a machine without a usable Vulkan
        # device falls back to CPU and says so in the document header.
        run: npx tauri build --bundles ${{ matrix.bundles }} --features vulkan

      - name: Build the installer (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: app
        # Windows shipped CPU-only until 2026-08-21, on the belief that
        # whisper.cpp could not register the Vulkan backend on MSVC static
        # builds (a static-init race in ggml_vk_instance_init). Retesting it
        # disproved that: the build only ever failed on Windows' MAX_PATH via
        # MSBuild's FileTracker, and the resulting installer initialized Vulkan
        # and reported `GPU (Vulkan0)` on real hardware. Measured on an RTX
        # 3080 Ti: one hour of audio in about 5 minutes, against roughly 4 hours
        # CPU-only. CUDA is still ~4x faster again, which is what
        # windows-cuda.yml is for, but Vulkan is the one build that covers the
        # Intel-iGPU laptops this tool was written for.
        #
        # CARGO_TARGET_DIR is what keeps that MAX_PATH failure away: ggml builds
        # its shader generator as a nested ExternalProject whose try-compile
        # paths overflow 260 characters from the default target directory.
        env:
          CARGO_TARGET_DIR: D:\t
        run: npx tauri build --bundles ${{ matrix.bundles }} --features vulkan

      # `app/src-tauri` is a workspace member, so cargo (and tauri, which shells out to
      # it) writes to the *workspace root's* target directory, not `app/src-tauri/target`
      # — that path never exists. Each matrix leg attaches only its own bundle, with an
      # explicit extension (not a bare `bundles/${{ matrix.bundles }}/*`, which would also
      # match the unpacked `Transcriba.AppDir/` directory tauri leaves next to the
      # AppImage), so a future path change fails the upload loudly instead of silently
      # attaching nothing.
      - name: Attach the AppImage to the release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true
          draft: true

      # D:\t, not target/: the Windows build redirects CARGO_TARGET_DIR to stay
      # under MAX_PATH, and tauri writes the bundle wherever cargo points.
      - name: Attach the Windows installer to the release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: D:\t\release\bundle\nsis\*.exe
          fail_on_unmatched_files: true
          draft: true
