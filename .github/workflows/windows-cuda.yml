# Builds a CUDA-enabled Windows installer on demand. Never part of a release.
#
# The shipped Windows installer is CPU-only: whisper.cpp fails to register the
# Vulkan backend on MSVC static builds, so there is no portable GPU path there,
# and the colleagues this tool was built for are on Intel-iGPU laptops that CUDA
# would not help anyway. On an NVIDIA desktop that tradeoff is expensive — a
# one-hour recording takes hours on CPU — so this produces a separate artifact
# for those machines instead of complicating the mainstream build.
#
# It is deliberately kept out of release.yml's releases: the output only runs on
# NVIDIA hardware, so sitting next to the normal installer it would invite the
# wrong download. Pushing a `v*-cuda` tag instead publishes it as its own draft
# prerelease, with `-cuda-` in the filename, and the installer is renamed before
# upload because tauri names both builds `Transcriba_<version>_x64-setup.exe`.
#
# Measured on an RTX 3080 Ti: one hour of audio in 1 minute 11 seconds, against
# roughly 4 hours for the same recording on the CPU-only build.
name: windows-cuda
on:
  workflow_dispatch:
  push:
    tags: ["v*-cuda"]

permissions:
  contents: write

jobs:
  bundle:
    # Pinned to the VS 2022 image, NOT windows-latest. windows-latest is now
    # VS 2026, and cmake picks the "Visual Studio 18 2026" generator there,
    # which needs MSBuild CUDA toolset files that the CUDA 12.6 installer does
    # not ship — it integrates with VS 2019/2022 only. nvcc installs fine and
    # then `enable_language(CUDA)` fails with "No CUDA toolset found" (run
    # 32462098797). Raising the toolkit version is the way off this pin; until
    # then the older image is what matches.
    runs-on: windows-2022
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # A distinct cache from release-bundle: these artifacts are compiled
      # against the CUDA toolkit and must not be restored into a CPU build.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ggml-portable
          shared-key: windows-cuda
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # windows-latest has no CUDA toolkit preinstalled and whisper.cpp needs
      # nvcc to compile the ggml-cuda backend. `method: network` fetches only
      # the listed subpackages rather than the full ~3GB installer.
      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Report the toolkit version
        run: |
          echo "CUDA_PATH=$env:CUDA_PATH"
          nvcc --version
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # CMAKE_CUDA_ARCHITECTURES pins the GPU generations to generate code for
      # instead of letting ggml guess from a build machine that has no GPU at
      # all: 86 is Ampere (RTX 30-series), 89 Ada (40-series), 75 Turing
      # (20-series/GTX 16). Without this, a runner with no device can emit code
      # for the wrong architecture and the app falls back to CPU at runtime
      # while still reporting success at build time.
      - name: Build the CUDA installer
        working-directory: app
        env:
          CMAKE_CUDA_ARCHITECTURES: "75;86;89"
        run: npx tauri build --bundles nsis --features cuda

      # tauri names this build exactly what the CPU build is named, so the two
      # are indistinguishable once downloaded. Renaming here rather than setting
      # a different productName keeps the installed application, its install
      # path and its settings identical to the CPU build — only the file someone
      # downloads differs.
      - name: Mark the installer as the CUDA build
        working-directory: target/release/bundle/nsis
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem *.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer found to rename" }
          Rename-Item $exe.FullName ($exe.Name -replace '-setup\.exe$', '-cuda-setup.exe')
          Get-ChildItem *.exe | ForEach-Object { echo $_.Name }
        shell: pwsh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: transcriba-nsis-cuda
          path: target/release/bundle/nsis/*-cuda-setup.exe
          if-no-files-found: error
          retention-days: 14

      # Only on a `v*-cuda` tag. Draft, like release.yml, so publication stays a
      # human decision; prerelease because this build runs on NVIDIA hardware
      # only and should never read as the default download.
      - name: Attach to its own draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*-cuda-setup.exe
          fail_on_unmatched_files: true
          draft: true
          prerelease: true
          body: |
            CUDA build for Windows machines with an NVIDIA GPU. **Requires an
            NVIDIA card** — on any other machine, use the standard installer
            from the matching non-CUDA release.

            Measured on an RTX 3080 Ti: one hour of audio in 1 minute 11
            seconds, against roughly 4 hours for the same recording on the
            CPU-only build.

            The document header reports the backend that actually ran, so a
            successful GPU run says `GPU (CUDA0)`. If it says `CPU (N threads)`,
            the CUDA backend did not initialize and this build gains you
            nothing over the standard one.

            Unsigned, like every build here: Windows will show "Windows
            protected your PC" — click More info, then Run anyway.
