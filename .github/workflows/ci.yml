name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # whisper-rs-sys never passes GGML_NATIVE, so ggml defaults it to ON
    # (whisper.cpp/ggml/CMakeLists.txt:106,120) and compiles libwhisper with
    # `-march=native` — tuned for whichever runner happened to build it.
    # rust-cache then restores that binary onto a runner of a different CPU
    # generation and ggml dies on the first kernel it dispatches: run
    # 31701641637 printed "AMX is not ready to be used!" during
    # whisper_model_load and aborted with `signal: 4, SIGILL: illegal
    # instruction`, on a docs-only commit whose target/ was a full cache hit.
    #
    # OFF flips ggml to its explicit baseline instead (INS_ENB=ON:
    # SSE4.2/AVX/AVX2/BMI2/FMA/F16C, with AVX512 and AMX off — same file,
    # lines 138-166), which is Haswell-era and portable across the whole
    # runner fleet. whisper-rs-sys's build.rs forwards every GGML_*, CMAKE_*
    # and WHISPER_* env var to cmake, which is what makes this reachable.
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The cache key covers Cargo.lock and the toolchain but NOT GGML_NATIVE,
      # and whisper-rs-sys emits no rerun-if-env-changed for it, so a cached
      # native libwhisper would survive the setting above. Bump this prefix
      # whenever the native/instruction-set flags change.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-ggml-portable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libvulkan-dev and glslc back the vulkan-feature check below.
          sudo apt-get install -y cmake libclang-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libvulkan-dev glslc

      - name: Verify Windows build tools
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          if (-not $?) { throw "cmake not found on windows-latest runner" }
          if (-not $env:LIBCLANG_PATH) { echo "LIBCLANG_PATH unset; bindgen may need it" }
        shell: pwsh

      - name: Fetch tiny model (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p tests/fixtures
          curl -fsL -o tests/fixtures/ggml-tiny.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin?download=true"

      - name: Fetch tiny model (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path tests/fixtures | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin?download=true" `
            -OutFile tests/fixtures/ggml-tiny.bin
        shell: pwsh

      # Type-checks the frontend, which nothing else in this workflow does. Not
      # a hard dependency for what follows: `cargo clippy`/`cargo test` do NOT
      # require `dist` to exist, because `generate_context!` short-circuits the
      # frontendDist existence check whenever `dev && devUrl.is_some()`
      # (tauri-codegen-2.6.3/src/context.rs:176-193), and `dev` is
      # `cfg!(not(feature = "custom-protocol"))` (tauri-macros-2.6.3/src/context.rs:155)
      # — a feature plain `cargo clippy`/`cargo test` never enable (only the
      # Tauri CLI passes `--features tauri/custom-protocol`). Kept before the
      # Rust steps anyway for hygiene and to mirror release.yml's structure.
      - name: Build the frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          TRANSCRIBA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/ggml-tiny.bin

      # Every release now ships `--features vulkan`, so the gpu_detect module and
      # its unit tests must compile and pass somewhere. Without this they are
      # invisible to CI and can rot until a release build fails. Linux-only for
      # cost, not correctness: apt supplies the loader and glslc in seconds,
      # where Windows needs the LunarG SDK installed on every run. The Windows
      # release build is the backstop for that leg.
      - name: Check the vulkan feature (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy -p transcriba-core --features vulkan --all-targets --locked -- -D warnings
          cargo test -p transcriba-core --features vulkan --locked
        env:
          TRANSCRIBA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/ggml-tiny.bin
