[package]
name = "transcriba-app"
version.workspace = true
edition.workspace = true

[lib]
name = "transcriba_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcriba-core = { path = "../../crates/core" }

[features]
default = []
# Forwards core's opportunistic Vulkan so `tauri build --features vulkan`
# reaches it — the CLI's `--features` applies to this crate, not to core.
#
# Enabled for every release since 2026-08-21. Measured 2026-08-13 on Intel
# Meteor Lake (Mesa): 110s vs 431s for a 5-minute clip, a 3.9x speedup, with
# transcripts matching to within one word. On Windows with an RTX 3080 Ti:
# one hour of audio in about 5 minutes, against roughly 4 hours CPU-only.
#
# Windows shipped CPU-only until then, on the belief that whisper.cpp could not
# register the backend on MSVC static builds. That was wrong: the build failed
# on Windows' MAX_PATH, not on any static-init race, and once it built the
# backend initialized and reported `GPU (Vulkan0)`.
#
# Build requirements: `libvulkan-dev` and `glslc` (shader compiler).
# The reported backend always reflects what actually ran — see core's
# `gpu_detect` — so a silent fallback to CPU shows up in the document header
# rather than being assumed away.
vulkan = ["transcriba-core/vulkan"]
# Same forwarding for CUDA, for the same reason: the Tauri CLI's `--features`
# applies to this crate, not to core. Not part of any release; built on demand
# by .github/workflows/windows-cuda.yml for NVIDIA machines, where the shipped
# CPU-only Windows build is the difference between minutes and hours.
cuda = ["transcriba-core/cuda"]
